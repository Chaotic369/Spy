<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spy</title>
<meta name="theme-color" content="#0d0d0f">
<style>
:root{
  --bg:#0d0d0f; --ink:#e8e2d4; --muted:#8a8478; --line:#2a2827;
  --brass:#b8925a; --blood:#8e2a2a; --card:#16151a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;}
body{padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#app{max-width:460px;margin:0 auto;padding:28px 0 60px;min-height:100vh}
h1{font-weight:400;font-size:36px;letter-spacing:.01em;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 22px;font-style:italic;line-height:1.5}
.panel{border-top:1px solid var(--line);padding:16px 0}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);
  padding:12px;font:inherit;font-size:16px;border-radius:2px}
select option{background:#16151a}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{font:inherit;cursor:pointer;background:transparent;color:var(--ink);
  border:1px solid var(--brass);padding:13px 18px;border-radius:2px;font-size:16px;
  width:100%;margin-top:10px}
button.primary{background:var(--brass);color:#120f0a}
button.ghost{border-color:var(--line);color:var(--muted);width:auto;padding:8px 12px;font-size:14px;margin:0}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
ul.players{list-style:none;padding:0;margin:10px 0}
ul.players li{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line)}
.hold{user-select:none;-webkit-user-select:none;touch-action:none;background:var(--card);
  border:1px solid var(--brass);padding:56px 20px;text-align:center;font-size:18px;
  margin:18px 0 6px;min-height:180px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;color:var(--muted)}
.word{font-size:34px;color:var(--brass);margin:12px 0}
.big{font-size:64px;text-align:center;margin:28px 0 10px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);
  padding:3px 8px;border-radius:2px;margin-bottom:6px}
.tag.spy{color:#d98a8a;border-color:var(--blood)}
.votes{display:grid;gap:8px;margin-top:12px}
.votes button{margin-top:0}
.score{color:var(--muted)}
.err{color:#d98a8a;font-size:14px;margin:8px 0 0}

/* ---- UI polish ---- */
body{-webkit-tap-highlight-color:transparent;background-image:radial-gradient(900px 420px at 50% -140px,#1f1b14 0%,rgba(13,13,15,0) 70%);background-repeat:no-repeat}
@supports(height:100dvh){#app{min-height:100dvh}}
#app.in{animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 4px rgba(184,146,90,.18);flex:none}
.panel{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0}
.panel.resume{border-color:var(--brass)}
ul.players li:last-child{border-bottom:0}
.pn{display:flex;align-items:center;gap:10px;min-width:0}
.av{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#221f1a;border:1px solid var(--brass);color:var(--brass);font-size:14px}
button{transition:transform .08s ease,background .2s ease,border-color .2s ease,color .2s ease}
button:active:not(:disabled){transform:scale(.98)}
button,input,select{border-radius:6px}
.ghost.wide{width:100%;margin-top:14px;padding:11px 12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0;line-height:1.6}
.hint .ghost{padding:3px 8px;font-size:12px;margin-left:4px}
.hold{border-radius:10px;-webkit-touch-callout:none;transition:border-color .15s,background .15s}
.hold:active{background:#1c1a21;border-color:#d7b27a}
.prog{display:flex;gap:6px;margin:0 0 16px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--brass)}
.big{font-size:76px;transition:color .3s,opacity .2s}
.big.low{color:#d98a8a}
.big.paused{opacity:.45}
.votes button.vb{display:flex;align-items:center;gap:12px;text-align:left}
.votes button.vb.sel{border-color:var(--blood);background:rgba(142,42,42,.22);color:#f0d0d0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#221f1a;border:1px solid var(--brass);color:var(--ink);padding:10px 16px;border-radius:6px;font-size:14px;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

var _packCache = {};
function getPacks() {
  var lvl = S.level === "mushkil" ? "mushkil" : "aasaan";
  if (_packCache[lvl]) return _packCache[lvl];
  var base = lvl === "mushkil" ? PACKS_HARD : PACKS_EASY;
  var more = lvl === "mushkil" ? PACKS_HARD_MORE : PACKS_EASY_MORE;
  var names = Object.keys(base);
  Object.keys(more).forEach(function (k) { if (names.indexOf(k) < 0) names.push(k); });
  var seen = {}, out = {};
  names.forEach(function (k) {
    out[k] = [];
    (base[k] || []).concat(more[k] || []).forEach(function (pr) {
      var a = wkey(pr[0]), b = wkey(pr[1]);
      if (a === b || seen[a] || seen[b]) return;   // a word never appears twice in a level
      seen[a] = 1; seen[b] = 1;
      out[k].push(pr);
    });
  });
  _packCache[lvl] = out;
  return out;
}

/* ---------- State ---------- */
const S = {
  screen: "setup",
  players: ["Gourav", "Dost 2", "Dost 3"],
  level: "aasaan",
  pack: Object.keys(PACKS_EASY)[0],
  spyCount: 1,
  spyWord: "twin",          // "twin" = Undercover (spy gets similar word), "none" = Classic
  discussionMin: 5,
  used: {},                 // pack name -> pairs already played
  scores: {},               // name -> points
  round: 0,
  roster: [],               // {name, role: "civ"|"spy", word, alive}
  civWord: "",
  spyWordText: null,
  revealIdx: 0,
  timerLeft: 0,
  timerId: null,
  paused: false,
  guessOpts: [],
  err: ""
};

const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const alive = () => S.roster.filter(p => p.alive);
const spiesAlive = () => S.roster.filter(p => p.role === "spy" && p.alive).length;
const civsAlive = () => S.roster.filter(p => p.role === "civ" && p.alive).length;

/* ---------- Local cache: names, settings, scores, used words ---------- */
var LS_KEY = "spyGame.v3";
var LS_ROUND = "spyGame.v3.round";
S.draft = "";
S.usedWords = {};
S.deadline = 0;
S.starter = "";
S.voteSel = -1;
S.resume = null;

function wkey(w) { return String(w).trim().toLowerCase(); }
function ini(n) { var a = Array.from(String(n)); return esc((a[0] || "?").toUpperCase()); }

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      players: S.players, level: S.level, pack: S.pack, spyCount: S.spyCount,
      spyWord: S.spyWord, discussionMin: S.discussionMin, scores: S.scores,
      usedWords: S.usedWords, round: S.round, draft: S.draft
    }));
  } catch (e) {}
}

function loadState() {
  try {
    var d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!d || typeof d !== "object") return;
    if (Array.isArray(d.players)) {
      var seen = {}, clean = [];
      d.players.forEach(function (p) {
        p = String(p).trim().slice(0, 16);
        var k = p.toLowerCase();
        if (p && !seen[k] && clean.length < 10) { seen[k] = 1; clean.push(p); }
      });
      S.players = clean;
    }
    if (d.level === "aasaan" || d.level === "mushkil") S.level = d.level;
    if (typeof d.pack === "string") S.pack = d.pack;
    if (d.spyCount >= 1 && d.spyCount <= 3) S.spyCount = Math.floor(d.spyCount);
    if (d.spyWord === "twin" || d.spyWord === "none") S.spyWord = d.spyWord;
    if ([3, 5, 8].indexOf(d.discussionMin) >= 0) S.discussionMin = d.discussionMin;
    if (d.scores && typeof d.scores === "object") {
      Object.keys(d.scores).forEach(function (k) {
        var v = Number(d.scores[k]);
        if (isFinite(v)) S.scores[k] = v;
      });
    }
    if (d.usedWords && typeof d.usedWords === "object") {
      Object.keys(d.usedWords).forEach(function (k) { S.usedWords[k] = 1; });
    }
    S.round = Number(d.round) || 0;
    S.draft = typeof d.draft === "string" ? d.draft.slice(0, 16) : "";
  } catch (e) {}
}

function saveDraft(v) {
  S.draft = String(v).slice(0, 16);
  saveState();
}

function saveRound(phase) {
  try {
    localStorage.setItem(LS_ROUND, JSON.stringify({
      phase: phase, roster: S.roster, civWord: S.civWord, spyWordText: S.spyWordText,
      round: S.round, timerLeft: S.timerLeft, starter: S.starter || "",
      pack: S.pack, level: S.level
    }));
  } catch (e) {}
}

function clearRound() {
  S.resume = null;
  try { localStorage.removeItem(LS_ROUND); } catch (e) {}
}

function loadRoundSaved() {
  try {
    var r = JSON.parse(localStorage.getItem(LS_ROUND) || "null");
    if (r && Array.isArray(r.roster) && r.roster.length >= 3 && r.civWord &&
        r.roster.every(function (p) { return p && typeof p.name === "string" && (p.role === "spy" || p.role === "civ"); })) {
      return r;
    }
  } catch (e) {}
  return null;
}

function resumePanel() {
  if (!S.resume) return "";
  return `<div class="panel resume">
      <label style="margin-top:0">Pichla round adhura reh gaya tha (Round ${Number(S.resume.round) || 1})</label>
      <button class="primary" onclick="resumeRound()">Wahi se jaari rakho</button>
      <button class="ghost wide" onclick="discardRound()">Chhod do</button>
    </div>`;
}

function resumeRound() {
  var r = S.resume;
  if (!r) return;
  S.roster = r.roster;
  S.civWord = r.civWord;
  S.spyWordText = r.spyWordText || null;
  S.round = Number(r.round) || S.round;
  S.timerLeft = Number(r.timerLeft) || 0;
  S.starter = r.starter || "";
  if (r.level === "aasaan" || r.level === "mushkil") S.level = r.level;
  if (r.pack && getPacks()[r.pack]) S.pack = r.pack;
  S.resume = null;
  if (r.phase === "vote") renderVote();
  else if (r.phase === "discussion") renderDiscussion(true);
  else renderDiscussion(false);
}

function discardRound() {
  clearRound();
  renderSetup();
}

function packHint() {
  var list = getPacks()[S.pack] || [];
  var left = list.filter(function (p) {
    return !S.usedWords[wkey(p[0])] && !S.usedWords[wkey(p[1])];
  }).length;
  return left + " / " + list.length + " naye pair bache hain. Ek baar aaya word dobara nahi aayega." +
    ' <button class="ghost" onclick="resetWords()">Reset</button>';
}

function resetWords() {
  if (!confirm("Saare used words phir se aa sakenge. Pakka?")) return;
  S.usedWords = {};
  saveState();
  renderSetup();
}

function resetScores() {
  if (!confirm("Saare scores zero karne hain?")) return;
  S.scores = {};
  saveState();
  renderSetup();
}

function toast(msg) {
  var t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = "show";
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = ""; }, 3200);
}

/* ---------- Setup ---------- */
function renderSetup() {
  S.screen = "setup";
  clearInterval(S.timerId);
  if (!getPacks()[S.pack]) S.pack = Object.keys(getPacks())[0];
  const n = S.players.length;

      <ul class="players">${list}</ul>
      <form class="row" onsubmit="addPlayer(event)">
        <input id="newName" maxlength="16" placeholder="Naam likho" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" value="${esc(S.draft)}" oninput="saveDraft(this.value)">
        <button type="submit" class="ghost" style="padding:12px 16px" ${n >= 10 ? "disabled" : ""}>Add</button>
      </form>

        <option value="aasaan" ${S.level === "aasaan" ? "selected" : ""}>Aasaan</option>
        <option value="mushkil" ${S.level === "mushkil" ? "selected" : ""}>Mushkil</option>
      </select>

      <label>Word pack</label>
      <select onchange="S.pack=this.value;saveState();renderSetup()">${packOpts}</select>
            <p class="hint">${packHint()}</p>

      <label>Spy kitne honge?</label>
      <select onchange="S.spyCount=+this.value;saveState()">${spyOpts}</select>

      <label>Spy ko word kaisa milega?</label>
      <select onchange="S.spyWord=this.value;saveState()">
        <option value="twin" ${S.spyWord === "twin" ? "selected" : ""}>Milta-julta word (Undercover)</option>
        <option value="none" ${S.spyWord === "none" ? "selected" : ""}>Kuch nahi (Classic)</option>
      </select>

      <label>Discussion ka timer</label>
      <select onchange="S.discussionMin=+this.value;saveState()">${timerOpts}</select>
    </div>

    <div class="panel">

    </div>

    ${Object.keys(S.scores).length ? `
      <div class="panel">

function addPlayer(e) {
  if (e) e.preventDefault();
  const v = $("newName").value.trim().slice(0, 16);
  if (!v) return;
  if (S.players.some(p => p.toLowerCase() === v.toLowerCase())) {
    S.err = "Ye naam pehle se hai.";
    return renderSetup();
  }
  if (S.players.length >= 10) return;
  S.players.push(v);
    S.draft = "";
    S.err = "";
    saveState();
    renderSetup();
  $("newName").focus();
}

function removePlayer(i) {
  S.players.splice(i, 1);
    saveState();
  S.err = "";
  renderSetup();
}

/* ---------- Round start ---------- */
function pickPair() {
  var list = getPacks()[S.pack] || [];
  var used = S.usedWords;
  var avail = list.filter(function (p) { return !used[wkey(p[0])] && !used[wkey(p[1])]; });
  if (!avail.length) {
    // every pair in this pack has been played: only now start this pack over
    list.forEach(function (p) { delete used[wkey(p[0])]; delete used[wkey(p[1])]; });
    avail = list.slice();
    toast("Is pack ke saare words ho chuke the, ab dobara shuru.");
  }
  var pair = avail[Math.floor(Math.random() * avail.length)];
  used[wkey(pair[0])] = 1;
  used[wkey(pair[1])] = 1;
  saveState();
  return pair;
}

function startRound() {
  if (S.players.length < 3) return;
  S.err = "";
  clearRound();
    const pair = pickPair();
  const flip = Math.random() < 0.5;
  const civWord = flip ? pair[1] : pair[0];
  const spyTwin = flip ? pair[0] : pair[1];
  const spyNames = new Set(shuffle(S.players).slice(0, S.spyCount));

  S.civWord = civWord;
  S.spyWordText = S.spyWord === "twin" ? spyTwin : null;
  S.roster = S.players.map(name => {
    const isSpy = spyNames.has(name);
    return {
      name,
      role: isSpy ? "spy" : "civ",
      word: isSpy ? S.spyWordText : civWord,
      alive: true
    };
  });
  S.revealIdx = 0;
  S.round++;
    saveState();
    renderReveal();
}

/* ---------- Secret reveal (hold to see) ---------- */
function renderReveal() {
  S.screen = "reveal";
  const p = S.roster[S.revealIdx];
  app.innerHTML = `
    <div class="prog">${S.roster.map((_, k) => `<i class="${k <= S.revealIdx ? "on" : ""}"></i>`).join("")}</div>
        <p class="sub">Player ${S.revealIdx + 1} of ${S.roster.length}</p>
    <h1>${esc(p.name)}</h1>
    <p class="sub">Phone sirf inhe do. Baaki log aankh band karein ya dusri taraf dekhein.</p>
    <div id="roleBox" class="hold"
      onpointerdown="showRole(${S.revealIdx})"
      onpointerup="hideRole()" onpointerleave="hideRole()" onpointercancel="hideRole()"
      oncontextmenu="return false">Dabaye rakho, dekhne ke liye</div>
    <button class="primary" id="nextBtn" disabled onclick="nextReveal()">Ho gaya, agla player</button>
  `;
}

function showRole(i) {
  const p = S.roster[i];
  $("nextBtn").disabled = false;
  const box = $("roleBox");
  if (p.role === "spy" && !p.word) {
    box.innerHTML = `<div class="tag spy">Tum SPY ho</div><p>Word nahi pata. Baaton se pakdo mat jaana.</p>`;
  } else {
    box.innerHTML = `<div class="tag">Tumhara word</div><div class="word">${esc(p.word)}</div>`;
  }
}

function hideRole() {
  const box = $("roleBox");
  if (box) box.innerHTML = "Dabaye rakho, dekhne ke liye";
}

function nextReveal() {
  S.revealIdx++;
  if (S.revealIdx >= S.roster.length) return renderDiscussion(false);
  renderReveal();
}

/* ---------- Discussion timer ---------- */
function renderDiscussion(keep) {
  S.screen = "discussion";
  if (!keep) {
    S.timerLeft = S.discussionMin * 60;
    var al = alive();
    S.starter = al.length ? al[Math.floor(Math.random() * al.length)].name : "";
  } else if (S.timerLeft <= 0) {
    S.timerLeft = 60;
  }
  S.paused = false;
  saveRound("discussion");

  app.innerHTML = `
    <p class="sub">Round ${S.round} · ${alive().length} player bache hain</p>
    <h1>Discussion</h1>
    <p class="sub">Sawal aisa rakho jo sirf word jaanne wale ka jawab de sake.${S.starter ? " Shuruwat: <b>" + esc(S.starter) + "</b>." : ""}</p>
    <div class="big${S.timerLeft <= 30 ? " low" : ""}" id="clock">${fmt(S.timerLeft)}</div>
    <div class="row">
      <button id="pauseBtn" onclick="togglePause()">Pause</button>
      <button class="primary" onclick="goVote()">Vote karo</button>
    </div>
    <div class="panel">
      <ul class="players">${alive().map(p => `<li><span class="pn"><i class="av">${ini(p.name)}</i>${esc(p.name)}</span></li>`).join("")}</ul>
    </div>
  `;
  startTimer();
}

function startTimer() {
  clearInterval(S.timerId);
  S.deadline = Date.now() + S.timerLeft * 1000;   // wall-clock based, so screen lock cannot freeze it
  S.timerId = setInterval(tick, 500);
}

function tick() {
  if (S.screen !== "discussion") { clearInterval(S.timerId); return; }
  if (S.paused) return;
  S.timerLeft = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000));
  var c = $("clock");
  if (c) {
    c.textContent = fmt(S.timerLeft);
    c.classList.toggle("low", S.timerLeft <= 30);
  }
  if (S.timerLeft <= 0) {
    clearInterval(S.timerId);
    goVote();
  } else if (S.timerLeft % 5 === 0) {
    saveRound("discussion");
  }
}

function togglePause() {
  if (!S.paused) { tick(); S.paused = true; }
  else { S.paused = false; S.deadline = Date.now() + S.timerLeft * 1000; }
  var b = $("pauseBtn");
  if (b) b.textContent = S.paused ? "Resume" : "Pause";
  var c = $("clock");
  if (c) c.classList.toggle("paused", S.paused);
  saveRound("discussion");
}

/* ---------- Voting ---------- */
function goVote() {
  clearInterval(S.timerId);
  renderVote();
}

function renderVote() {
  S.screen = "vote";
  S.voteSel = -1;
  saveRound("vote");
  var buttons = S.roster
    .map(function (p, i) { return { p: p, i: i }; })
    .filter(function (x) { return x.p.alive; })
    .map(function (x) {
      return `<button class="vb" id="vb${x.i}" onclick="pickVote(${x.i})"><i class="av">${ini(x.p.name)}</i>${esc(x.p.name)}</button>`;
    })
    .join("");
  app.innerHTML = `
    <h1>Vote</h1>
    <p class="sub">Group mein faisla karo, phir jiske against vote hua use chuno.</p>
    <div class="votes">${buttons}</div>
    <button class="primary" id="confirmVote" disabled onclick="confirmVote()">Pehle kisi ko chuno</button>
    <button class="ghost wide" onclick="renderDiscussion(true)">Barabar vote, discussion wapas</button>
  `;
}

function pickVote(i) {
  if (S.screen !== "vote") return;
  S.voteSel = i;
  S.roster.forEach(function (p, k) {
    var b = $("vb" + k);
    if (b) b.classList.toggle("sel", k === i);
  });
  var c = $("confirmVote");
  if (c) {
    c.disabled = false;
    c.textContent = S.roster[i].name + " ko bahar karo";
  }
}

function confirmVote() {
  if (S.screen !== "vote" || S.voteSel < 0) return;
  eliminate(S.voteSel);
}

function eliminate(i) {
  if (S.screen !== "vote") return;
  const p = S.roster[i];
  if (!p || !p.alive) return;
  p.alive = false;

  // Last spy caught: spy gets one chance to guess the civilian word.
  if (p.role === "spy" && spiesAlive() === 0) return renderGuess(p);

  // Spies equal or outnumber civilians: spies win.
  if (spiesAlive() >= civsAlive()) {
    return endRound("spy", `${p.name} nikla gaya, aur ab spies barabar ya zyada hain.`);
  }

  renderOut(p);
}

function renderOut(p) {
  S.screen = "out";
  saveRound("out");
  app.innerHTML = `
    <p class="sub">Vote ka faisla</p>
    <h1>${esc(p.name)} bahar</h1>
    <span class="tag ${p.role === "spy" ? "spy" : ""}">${p.role === "spy" ? "Ye SPY tha" : "Ye civilian tha"}</span>
    <p class="sub">Khel chal raha hai. Dhyaan rakho, spy abhi bhi group mein hai.</p>
    <button class="primary" onclick="renderDiscussion(false)">Discussion jaari rakho</button>
  `;
}

/* ---------- Spy's last chance ---------- */
function renderGuess(p) {
  S.screen = "guess";
  // Unique words only: the packs share some words, so the decoy pool must be deduplicated.
  const everyWord = [...new Set((getPacks()[S.pack] || []).flat())];
  const pool = shuffle(everyWord.filter(w => w !== S.civWord && w !== S.spyWordText));
  S.guessOpts = shuffle([S.civWord, ...pool.slice(0, 3)]);
  app.innerHTML = `
    <p class="sub">Aakhri mauka</p>
    <h1>${esc(p.name)} spy tha</h1>
    <p class="sub">Civilian ka word sahi guess kiya to spies jeet jaayenge.</p>
    <div class="votes">
      ${S.guessOpts.map((w, i) => `<button onclick="guessAnswer(${i})">${esc(w)}</button>`).join("")}
    </div>
  `;
}

function guessAnswer(i) {
  if (S.screen !== "guess") return;
  if (S.guessOpts[i] === S.civWord) {
    endRound("spy", "Spy ne civilian ka word sahi guess kar liya.");
  } else {
    endRound("civ", "Spy ka guess galat nikla. Civilians jeet gaye.");
  }
}

/* ---------- Round end and scoring ---------- */
function endRound(winner, reason) {
  if (S.screen === "result") return;
  clearInterval(S.timerId);
  S.screen = "result";
  clearRound();
  const winners = S.roster.filter(p => winner === "spy" ? p.role === "spy" : p.role === "civ");
  winners.forEach(p => {
    S.scores[p.name] = (S.scores[p.name] || 0) + (winner === "spy" ? 3 : 2);
  });

  saveState();
    const spyNames = S.roster.filter(p => p.role === "spy").map(p => esc(p.name)).join(", ");
  const scoreRows = S.players.map(p =>
    `<li><span>${esc(p)}</span><span class="score">${S.scores[p] || 0}</span></li>`).join("");

  app.innerHTML = `
    <p class="sub">Round ${S.round} khatam</p>
    <h1>${winner === "spy" ? "Spies jeet gaye" : "Civilians jeet gaye"}</h1>
    <p class="sub">${esc(reason)}</p>
    <div class="panel">
      <p>Civilian ka word: <span class="word" style="font-size:22px">${esc(S.civWord)}</span></p>
      <p>Spy: ${spyNames}</p>
      <p>Spy ka word: ${S.spyWordText ? `<span class="word" style="font-size:22px">${esc(S.spyWordText)}</span>` : "koi nahi (Classic)"}</p>
    </div>
    <div class="panel">
      <label>Scoreboard</label>
      <ul class="players">${scoreRows}</ul>
    </div>
    <button class="primary" onclick="startRound()">Agla round, same log</button>
    <button onclick="renderSetup()">Setup par jao</button>
  `;
}

var _lastScr = "";
new MutationObserver(function () {
  if (S.screen === "setup" && _lastScr === "setup") return;
  _lastScr = S.screen;
  app.classList.remove("in");
  void app.offsetWidth;
  app.classList.add("in");
}).observe(app, { childList: true });

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    if (S.screen === "discussion") tick();
  } else {
    saveState();
    if (S.screen === "discussion" || S.screen === "vote" || S.screen === "out") saveRound(S.screen);
  }
});
window.addEventListener("pagehide", saveState);

loadState();
S.resume = loadRoundSaved();
renderSetup();
</script>
</body>
</html>
