<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spy</title>
<meta name="theme-color" content="#0d0d0f">
<style>
:root{
  --bg:#0d0d0f; --ink:#e8e2d4; --muted:#8a8478; --line:#2a2827;
  --brass:#b8925a; --blood:#8e2a2a; --card:#16151a; --card2:#1f1e25;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;}
body{padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#app{max-width:460px;margin:0 auto;padding:28px 0 60px;min-height:100vh}
h1{font-weight:400;font-size:36px;letter-spacing:.01em;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:0 0 22px;font-style:italic;line-height:1.5}
.panel{background:var(--card);padding:16px 0}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;background:var(--card2);border:0;color:var(--ink);
  padding:12px;font:inherit;font-size:16px;border-radius:2px}
select option{background:#16151a}
input:focus,select:focus,button:focus-visible{outline:none;background:#27252e}
button{font:inherit;cursor:pointer;background:var(--card2);color:var(--ink);
  border:0;padding:13px 18px;border-radius:2px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:10px}
button.primary{background:var(--brass);color:#120f0a}
button.ghost{color:var(--muted);width:auto;padding:8px 12px;font-size:14px;margin:0}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
ul.players{list-style:none;padding:0;margin:10px 0}
ul.players li{display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;margin-bottom:6px;border-radius:8px;background:var(--card2)}
.hold{user-select:none;-webkit-user-select:none;touch-action:none;background:var(--card);
  padding:56px 20px;text-align:center;font-size:18px;
  margin:18px 0 6px;min-height:180px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;color:var(--muted)}
.word{font-size:34px;color:var(--brass);margin:12px 0}
.big{font-size:64px;text-align:center;margin:28px 0 10px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;color:var(--muted);background:var(--card2);
  padding:3px 8px;border-radius:2px;margin-bottom:6px}
.tag.spy{color:#d98a8a;background:rgba(142,42,42,.25)}
.votes{display:grid;gap:8px;margin-top:12px}
.votes button{margin-top:0}
.score{color:var(--muted)}
.err{color:#d98a8a;font-size:14px;margin:8px 0 0}

/* ---- UI polish ---- */
body{-webkit-tap-highlight-color:transparent;background-image:radial-gradient(900px 420px at 50% -140px,#1f1b14 0%,rgba(13,13,15,0) 70%);background-repeat:no-repeat}
@supports(height:100dvh){#app{min-height:100dvh}}
#app.in{animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 4px rgba(184,146,90,.18);flex:none}
.panel{background:var(--card);border-radius:12px;padding:14px 16px;margin:14px 0}
.panel.resume{background:#211c14}
ul.players li:last-child{margin-bottom:0}
.pn{display:flex;align-items:center;gap:10px;min-width:0}
.av{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#2a2620;color:var(--brass);font-size:14px}
button{transition:transform .08s ease,background .2s ease,border-color .2s ease,color .2s ease}
button:active:not(:disabled){transform:scale(.98)}
button,input,select{border-radius:6px}
.ghost.wide{width:100%;margin-top:14px;padding:11px 12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0;line-height:1.6}
.hint .ghost{padding:3px 8px;font-size:12px;margin-left:4px}
.hold{border-radius:10px;-webkit-touch-callout:none;transition:border-color .15s,background .15s}
.hold:active{background:#1c1a21}
.prog{display:flex;gap:6px;margin:0 0 16px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--brass)}
.big{font-size:76px;transition:color .3s,opacity .2s}
.big.low{color:#d98a8a}
.big.paused{opacity:.45}
.votes button.vb{display:flex;align-items:center;gap:12px;text-align:left}
.votes button.vb.sel{background:rgba(142,42,42,.3);color:#f0d0d0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#2a2620;color:var(--ink);padding:10px 16px;border-radius:6px;font-size:14px;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.votes button.vb{justify-content:flex-start}
label .ic,.tag .ic{margin-right:6px}
h1 .ic{width:.85em;height:.85em;color:var(--brass)}
.hold .ic{width:40px;height:40px;margin-bottom:12px;color:var(--brass)}

/* ---- Game look ---- */
:root{--brass:#ffc857;--blood:#ff4d6d;--card:#1b1933;--card2:#292552;--muted:#a49fc8;--ink:#f4f1ff}
html,body{background-color:#0b0a14;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
body{background-image:radial-gradient(700px 380px at 50% -120px,#43307a 0%,rgba(11,10,20,0) 70%),radial-gradient(520px 320px at 100% 100%,#1d2f5a 0%,rgba(11,10,20,0) 70%);background-attachment:fixed}
h1{font-weight:800;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.35)}
h1 .ic{filter:drop-shadow(0 0 8px rgba(255,200,87,.6))}
.sub{font-style:normal;font-weight:600}
.panel{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.panel:nth-of-type(2){animation-delay:.05s}
.panel:nth-of-type(3){animation-delay:.1s}
.panel.resume{background:linear-gradient(135deg,#3a2c12,#2a2140)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
label{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
input,select{background:var(--card2);border-radius:14px;font-weight:600}
input:focus,select:focus,button:focus-visible{outline:none;background:#342f66;box-shadow:0 0 0 4px rgba(255,200,87,.25)}
button{background:var(--card2);border-radius:14px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 0 #13112b;transition:transform .08s ease,box-shadow .08s ease,filter .2s ease}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #13112b}
button.primary{background:linear-gradient(180deg,#ffe08a,#ffb62e);color:#2b1a00;box-shadow:0 4px 0 #b36b00,0 10px 22px rgba(255,182,46,.28)}
button.primary:active:not(:disabled){box-shadow:0 1px 0 #b36b00,0 4px 10px rgba(255,182,46,.2)}
button.ghost{background:#312c5e;color:var(--ink);box-shadow:0 3px 0 #13112b}
button.ghost:active:not(:disabled){box-shadow:0 1px 0 #13112b}
button:disabled{filter:grayscale(.8);opacity:.45;box-shadow:0 4px 0 #13112b}
ul.players li{background:var(--card2);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.av{width:34px;height:34px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c5cff,#4a8dff);box-shadow:0 3px 0 rgba(0,0,0,.3)}
ul.players li:nth-child(5n+2) .av,.votes button:nth-child(5n+2) .av{background:linear-gradient(135deg,#ff6b9a,#ff4d6d)}
ul.players li:nth-child(5n+3) .av,.votes button:nth-child(5n+3) .av{background:linear-gradient(135deg,#34d399,#10a37f)}
ul.players li:nth-child(5n+4) .av,.votes button:nth-child(5n+4) .av{background:linear-gradient(135deg,#ffb62e,#ff7a18)}
ul.players li:nth-child(5n) .av,.votes button:nth-child(5n) .av{background:linear-gradient(135deg,#38bdf8,#2563eb)}
.score{background:linear-gradient(180deg,#ffe08a,#ffb62e);color:#2b1a00;font-weight:800;border-radius:999px;padding:2px 12px;min-width:34px;text-align:center;box-shadow:0 2px 0 #b36b00}
.tag{background:var(--card2);border-radius:999px;padding:5px 14px;font-weight:700;display:inline-flex;align-items:center}
.tag.spy{background:linear-gradient(180deg,#ff6b8a,#e0264b);color:#fff;box-shadow:0 3px 0 #8e1230}
.hold{background:linear-gradient(160deg,#2b2660,#1b1933);border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,200,87,.35);animation:glow 2.2s ease-in-out infinite}
.hold:active{background:linear-gradient(160deg,#3a3280,#241f4a);animation:none;transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,200,87,.35)}
@keyframes glow{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 0 rgba(255,200,87,.3)}50%{box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 0 10px rgba(255,200,87,0)}}
.word{font-weight:800;text-shadow:0 0 18px rgba(255,200,87,.55);animation:pop .3s cubic-bezier(.2,1.6,.4,1) both}
.prog{gap:8px}
.prog i{height:10px;border-radius:999px;background:var(--card2)}
.prog i.on{background:linear-gradient(90deg,#ffe08a,#ffb62e);box-shadow:0 0 10px rgba(255,200,87,.6)}
.big{font-weight:800;color:#fff;text-shadow:0 0 22px rgba(124,92,255,.7),0 4px 0 rgba(0,0,0,.35)}
.big.low{color:#ff6b8a;text-shadow:0 0 22px rgba(255,77,109,.8),0 4px 0 rgba(0,0,0,.35);animation:beat 1s ease-in-out infinite}
.big.paused{animation:none}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.votes{gap:10px}
.votes button.vb{background:var(--card2);padding:12px 16px;font-size:17px}
.votes button.vb.sel{background:linear-gradient(180deg,#ff6b8a,#e0264b);color:#fff;box-shadow:0 4px 0 #8e1230,0 0 22px rgba(255,77,109,.45);transform:translateY(-2px)}
#toast{background:var(--card2);border-radius:999px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.35)}

/* ---- Brown / orange / red theme ---- */
:root{--brass:#ff9d3c;--blood:#e63a1f;--card:#2a1810;--card2:#3d2417;--muted:#c9a58a;--ink:#fff3e6}
html,body{background-color:#140c08}
body{background-image:radial-gradient(700px 380px at 50% -120px,#7a2e10 0%,rgba(20,12,8,0) 70%),radial-gradient(520px 320px at 100% 100%,#5a1a0e 0%,rgba(20,12,8,0) 70%)}
h1 .ic{filter:drop-shadow(0 0 8px rgba(255,138,43,.65))}
.panel{box-shadow:0 6px 0 #120905}
.panel.resume{background:linear-gradient(135deg,#5a2a10,#3a1a12)}
input:focus,select:focus,button:focus-visible{background:#54301d;box-shadow:0 0 0 4px rgba(255,138,43,.3)}
button{box-shadow:0 4px 0 #120905}
button:active:not(:disabled){box-shadow:0 1px 0 #120905}
button.primary{background:linear-gradient(180deg,#ffb04d,#f0661a);color:#2a1000;box-shadow:0 4px 0 #9c3a0a,0 10px 22px rgba(240,102,26,.32)}
button.primary:active:not(:disabled){box-shadow:0 1px 0 #9c3a0a,0 4px 10px rgba(240,102,26,.22)}
button.ghost{background:#4d2d1c;box-shadow:0 3px 0 #120905}
button.ghost:active:not(:disabled){box-shadow:0 1px 0 #120905}
button:disabled{box-shadow:0 4px 0 #120905}
ul.players li{box-shadow:0 3px 0 rgba(0,0,0,.3)}
.av{background:linear-gradient(135deg,#ff9d3c,#e8590c)}
ul.players li:nth-child(5n+2) .av,.votes button:nth-child(5n+2) .av{background:linear-gradient(135deg,#ff6b4a,#d62d20)}
ul.players li:nth-child(5n+3) .av,.votes button:nth-child(5n+3) .av{background:linear-gradient(135deg,#c98a4b,#8b5a2b)}
ul.players li:nth-child(5n+4) .av,.votes button:nth-child(5n+4) .av{background:linear-gradient(135deg,#ffc15e,#f08a1c)}
ul.players li:nth-child(5n) .av,.votes button:nth-child(5n) .av{background:linear-gradient(135deg,#e8743b,#a8321a)}
.score{background:linear-gradient(180deg,#ffb04d,#f0661a);color:#2a1000;box-shadow:0 2px 0 #9c3a0a}
.tag.spy{background:linear-gradient(180deg,#ff5a3c,#c42a14);color:#fff;box-shadow:0 3px 0 #6e1608}
.hold{background:linear-gradient(160deg,#5a2a14,#2a1810);box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 0 0 rgba(255,138,43,.35)}
.hold:active{background:linear-gradient(160deg,#703618,#38200f);box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px rgba(255,138,43,.4)}
@keyframes glow{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 0 0 rgba(255,138,43,.35)}50%{box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 0 10px rgba(255,138,43,0)}}
.word{text-shadow:0 0 18px rgba(255,138,43,.6)}
.prog i.on{background:linear-gradient(90deg,#ffb04d,#f0661a);box-shadow:0 0 10px rgba(255,138,43,.65)}
.big{text-shadow:0 0 22px rgba(240,102,26,.7),0 4px 0 rgba(0,0,0,.4)}
.big.low{color:#ff5a3c;text-shadow:0 0 22px rgba(230,58,31,.85),0 4px 0 rgba(0,0,0,.4)}
.votes button.vb.sel{background:linear-gradient(180deg,#ff5a3c,#c42a14);box-shadow:0 4px 0 #6e1608,0 0 22px rgba(230,58,31,.5)}

/* ---- Custom controls (no native UI) ---- */
input{-webkit-appearance:none;appearance:none;caret-color:var(--brass);box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
input::placeholder{color:var(--muted);opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 4px}
.chip{width:auto;margin:0;padding:10px 16px;font-size:15px;background:var(--card2);color:var(--ink);text-align:center}
.chip.on{background:linear-gradient(180deg,#ffb04d,#f0661a);color:#2a1000;box-shadow:0 4px 0 #9c3a0a,0 8px 18px rgba(240,102,26,.3);transform:translateY(-1px)}
.chip.on:active:not(:disabled){box-shadow:0 1px 0 #9c3a0a}
button{-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none}

/* ---- Modal ---- */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,5,3,.72);animation:fade .2s ease both}
#modal .dlg{width:100%;max-width:360px;background:var(--card);border-radius:22px;padding:22px 18px 18px;box-shadow:0 8px 0 #120905,0 20px 50px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
#modal p{margin:0 0 16px;font-size:18px;font-weight:700;line-height:1.4;text-align:center}
#modal .row button{margin-top:0;flex:1;width:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- Animations ---- */
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.06)}40%{transform:rotate(5deg) scale(1.06)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes growX{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

#app.in>*{animation:drop .35s ease backwards}
#app.in>*:nth-child(2){animation-delay:.04s}
#app.in>*:nth-child(3){animation-delay:.08s}
#app.in>*:nth-child(4){animation-delay:.12s}

h1 .ic{animation:floaty 3.2s ease-in-out infinite;transform-origin:50% 60%}
.hold .ic{animation:bob 1.8s ease-in-out infinite}

ul.players li{animation:slideIn .35s cubic-bezier(.2,1.2,.4,1) backwards}
ul.players li:nth-child(2){animation-delay:.05s}
ul.players li:nth-child(3){animation-delay:.1s}
ul.players li:nth-child(4){animation-delay:.15s}
ul.players li:nth-child(5){animation-delay:.2s}
ul.players li:nth-child(6){animation-delay:.25s}
ul.players li:nth-child(n+7){animation-delay:.3s}
.av{animation:popIn .4s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:.1s}

.votes button{animation:popIn .35s cubic-bezier(.2,1.4,.4,1) backwards}
.votes button:nth-child(2){animation-delay:.05s}
.votes button:nth-child(3){animation-delay:.1s}
.votes button:nth-child(4){animation-delay:.15s}
.votes button:nth-child(5){animation-delay:.2s}
.votes button:nth-child(n+6){animation-delay:.25s}

.chip{animation:popIn .3s cubic-bezier(.2,1.4,.4,1) backwards}
.chip:nth-child(2){animation-delay:.04s}
.chip:nth-child(3){animation-delay:.08s}
.chip:nth-child(4){animation-delay:.12s}
.chip.on{animation:popIn .35s cubic-bezier(.2,1.6,.4,1) backwards}

button.primary{position:relative;overflow:hidden}
button.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));transform:skewX(-20deg);pointer-events:none;animation:shine 3.4s ease-in-out infinite}
button.primary:disabled::after{display:none}
button .ic{transition:transform .2s ease}
button:hover:not(:disabled) .ic{transform:translateX(2px) scale(1.1)}
button:active:not(:disabled) .ic{transform:scale(.9)}

.tag{animation:popIn .35s cubic-bezier(.2,1.5,.4,1) backwards}
.tag.spy{animation:popIn .35s cubic-bezier(.2,1.5,.4,1) backwards,wobble .7s ease .35s 1}
.score{animation:popIn .4s cubic-bezier(.2,1.6,.4,1) backwards;animation-delay:.15s}
.err{animation:shake .45s ease}
.prog i.on{transform-origin:left center;animation:growX .4s ease backwards}
.hint{animation:fade .4s ease backwards}
.word{animation:popIn .35s cubic-bezier(.2,1.6,.4,1) backwards}

#toast{transition:opacity .25s,transform .45s cubic-bezier(.2,1.6,.4,1)}
#modal .dlg p{animation:drop .35s ease .08s backwards}
#modal .row button{animation:popIn .35s cubic-bezier(.2,1.4,.4,1) backwards}
#modal .row button:nth-child(2){animation-delay:.08s}

#app.still>*,#app.still .panel,#app.still ul.players li,#app.still .av,#app.still .votes button,#app.still .chip,#app.still .chip.on,#app.still .tag,#app.still .tag.spy,#app.still .score,#app.still .err,#app.still .prog i.on,#app.still .hint,#app.still .word{animation:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  }

  /* ---- Animated background ---- */
  html{background:linear-gradient(180deg,#1a0d07 0%,#140c08 55%,#1f0d08 100%)}
  body{background-color:transparent}
  #app{position:relative;z-index:1}
  body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0}
  body::before{
    inset:-25%;
    background:
      radial-gradient(38% 34% at 20% 25%,rgba(255,122,24,.34) 0%,rgba(255,122,24,0) 70%),
      radial-gradient(34% 30% at 80% 20%,rgba(214,45,32,.30) 0%,rgba(214,45,32,0) 70%),
      radial-gradient(40% 36% at 70% 80%,rgba(160,82,30,.34) 0%,rgba(160,82,30,0) 70%),
      radial-gradient(30% 28% at 15% 85%,rgba(255,176,77,.20) 0%,rgba(255,176,77,0) 70%);
    animation:aurora 26s ease-in-out infinite alternate;
    will-change:transform
  }
  body::after{
    inset:0;
    background-image:
      radial-gradient(circle,rgba(255,176,77,.95) 0 1.5px,rgba(255,176,77,0) 3px),
      radial-gradient(circle,rgba(255,122,24,.85) 0 2px,rgba(255,122,24,0) 4px),
      radial-gradient(circle,rgba(255,90,60,.75) 0 2.5px,rgba(255,90,60,0) 5px);

var _packCache = {};
function getPacks() {
  var lvl = S.level === "mushkil" ? "mushkil" : "aasaan";
  if (_packCache[lvl]) return _packCache[lvl];
  var base = lvl === "mushkil" ? PACKS_HARD : PACKS_EASY;
  var more = lvl === "mushkil" ? PACKS_HARD_MORE : PACKS_EASY_MORE;
  var names = Object.keys(base);
  Object.keys(more).forEach(function (k) { if (names.indexOf(k) < 0) names.push(k); });
  var seen = {}, out = {};
  names.forEach(function (k) {
    out[k] = [];
    (base[k] || []).concat(more[k] || []).forEach(function (pr) {
      var a = wkey(pr[0]), b = wkey(pr[1]);
      if (a === b || seen[a] || seen[b]) return;   // a word never appears twice in a level
      seen[a] = 1; seen[b] = 1;
      out[k].push(pr);
    });
  });
  _packCache[lvl] = out;
  return out;
}

function wkey(w) { return String(w).trim().toLowerCase(); }
function ini(n) { var a = Array.from(String(n)); return esc((a[0] || "?").toUpperCase()); }

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      players: S.players, level: S.level, pack: S.pack, spyCount: S.spyCount,
      spyWord: S.spyWord, discussionMin: S.discussionMin, scores: S.scores,
      usedWords: S.usedWords, round: S.round, draft: S.draft
    }));
  } catch (e) {}
}

function loadState() {
  try {
    var d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!d || typeof d !== "object") return;
    if (Array.isArray(d.players)) {
      var seen = {}, clean = [];
      d.players.forEach(function (p) {
        p = String(p).trim().slice(0, 16);
        var k = p.toLowerCase();
        if (p && !seen[k] && clean.length < 10) { seen[k] = 1; clean.push(p); }
      });
      S.players = clean;
    }
    if (d.level === "aasaan" || d.level === "mushkil") S.level = d.level;
    if (typeof d.pack === "string") S.pack = d.pack;
    if (d.spyCount >= 1 && d.spyCount <= 3) S.spyCount = Math.floor(d.spyCount);
    if (d.spyWord === "twin" || d.spyWord === "none") S.spyWord = d.spyWord;
    if ([3, 5, 8].indexOf(d.discussionMin) >= 0) S.discussionMin = d.discussionMin;
    if (d.scores && typeof d.scores === "object") {
      Object.keys(d.scores).forEach(function (k) {
        var v = Number(d.scores[k]);
        if (isFinite(v)) S.scores[k] = v;
      });
    }
    if (d.usedWords && typeof d.usedWords === "object") {
      Object.keys(d.usedWords).forEach(function (k) { S.usedWords[k] = 1; });
    }
    S.round = Number(d.round) || 0;
    S.draft = typeof d.draft === "string" ? d.draft.slice(0, 16) : "";
  } catch (e) {}
}

function saveDraft(v) {
  S.draft = String(v).slice(0, 16);
  saveState();
}

function saveRound(phase) {
  try {
    localStorage.setItem(LS_ROUND, JSON.stringify({
      phase: phase, roster: S.roster, civWord: S.civWord, spyWordText: S.spyWordText,
      round: S.round, timerLeft: S.timerLeft, starter: S.starter || "",
      pack: S.pack, level: S.level
    }));
  } catch (e) {}
}

function clearRound() {
  S.resume = null;
  try { localStorage.removeItem(LS_ROUND); } catch (e) {}
}

function loadRoundSaved() {
  try {
    var r = JSON.parse(localStorage.getItem(LS_ROUND) || "null");
    if (r && Array.isArray(r.roster) && r.roster.length >= 3 && r.civWord &&
        r.roster.every(function (p) { return p && typeof p.name === "string" && (p.role === "spy" || p.role === "civ"); })) {
      return r;
    }
  } catch (e) {}
  return null;
}

function resumeRound() {
  var r = S.resume;
  if (!r) return;
  S.roster = r.roster;
  S.civWord = r.civWord;
  S.spyWordText = r.spyWordText || null;
  S.round = Number(r.round) || S.round;
  S.timerLeft = Number(r.timerLeft) || 0;
  S.starter = r.starter || "";
  if (r.level === "aasaan" || r.level === "mushkil") S.level = r.level;
  if (r.pack && getPacks()[r.pack]) S.pack = r.pack;
  S.resume = null;
  if (r.phase === "vote") renderVote();
  else if (r.phase === "discussion") renderDiscussion(true);
  else renderDiscussion(false);
}

function discardRound() {
  clearRound();
  renderSetup();
}

function packHint() {
  var list = getPacks()[S.pack] || [];
  var left = list.filter(function (p) {
    return !S.usedWords[wkey(p[0])] && !S.usedWords[wkey(p[1])];
  }).length;
  return left + " / " + list.length + " naye pair bache hain. Ek baar aaya word dobara nahi aayega." +
    ' <button class="ghost" onclick="resetWords()">Reset</button>';
}

function askConfirm(msg, onYes) {
  var old = document.getElementById("modal");
  if (old) old.remove();
  var o = document.createElement("div");
  o.id = "modal";
  o.innerHTML = '<div class="dlg"><p>' + esc(msg) + '</p><div class="row">' +
    '<button type="button" class="ghost" id="mNo">' + ic("x") + 'Nahi</button>' +
    '<button type="button" class="primary" id="mYes">' + ic("check") + 'Haan</button></div></div>';
  document.body.appendChild(o);
  var close = function () { o.remove(); };
  document.getElementById("mNo").onclick = close;
  document.getElementById("mYes").onclick = function () { close(); onYes(); };
  o.onclick = function (e) { if (e.target === o) close(); };
}

  var t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";

  t.textContent = msg;
  t.className = "show";
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = ""; }, 3200);
}

  const v = $("newName").value.trim().slice(0, 16);
  if (!v) return;
  if (S.players.some(p => p.toLowerCase() === v.toLowerCase())) {
    S.err = "Ye naam pehle se hai.";
    return renderSetup();
  }
  if (S.players.length >= 10) return;
  S.players.push(v);
    S.draft = "";
    S.err = "";
    saveState();
    renderSetup();
  $("newName").focus();
}

function removePlayer(i) {
  S.players.splice(i, 1);
    saveState();
  S.err = "";
  renderSetup();
}

/* ---------- Round start ---------- */
function pickPair() {
  var list = getPacks()[S.pack] || [];
  var used = S.usedWords;
  var avail = list.filter(function (p) { return !used[wkey(p[0])] && !used[wkey(p[1])]; });
  if (!avail.length) {
    // every pair in this pack has been played: only now start this pack over
    list.forEach(function (p) { delete used[wkey(p[0])]; delete used[wkey(p[1])]; });
    avail = list.slice();
    toast("Is pack ke saare words ho chuke the, ab dobara shuru.");
  }
  var pair = avail[Math.floor(Math.random() * avail.length)];
  used[wkey(pair[0])] = 1;
  used[wkey(pair[1])] = 1;
  saveState();
  return pair;
}

function startRound() {
  if (S.players.length < 3) return;
  S.err = "";
  clearRound();
    const pair = pickPair();
  const flip = Math.random() < 0.5;
  const civWord = flip ? pair[1] : pair[0];
  const spyTwin = flip ? pair[0] : pair[1];
  const spyNames = new Set(shuffle(S.players).slice(0, S.spyCount));

  S.civWord = civWord;
  S.spyWordText = S.spyWord === "twin" ? spyTwin : null;
  S.roster = S.players.map(name => {
    const isSpy = spyNames.has(name);
    return {
      name,
      role: isSpy ? "spy" : "civ",
      word: isSpy ? S.spyWordText : civWord,
      alive: true
    };
  });
  S.revealIdx = 0;
  S.round++;
    saveState();
    renderReveal();
}

/* ---------- Secret reveal (hold to see) ---------- */
const holdIdle = () => `<span class="fp">${ic("touch")}</span><b class="hl">Dabaye rakho</b><span class="hs">dekhne ke liye</span>`;

function renderReveal() {
  S.screen = "reveal";
  const p = S.roster[S.revealIdx];
  app.innerHTML = `
    <div class="prog">${S.roster.map((_, k) => `<i class="${k < S.revealIdx ? "on" : k === S.revealIdx ? "on cur" : ""}"></i>`).join("")}</div>
        <div class="who"><i class="av lg">${ini(p.name)}</i><div class="wt"><p class="sub">Player ${S.revealIdx + 1} of ${S.roster.length}</p><h1>${esc(p.name)}</h1></div></div>
    <p class="sub">Phone sirf inhe do. Baaki log aankh band karein ya dusri taraf dekhein.</p>
    <div id="roleBox" class="hold"
      onpointerdown="showRole(${S.revealIdx})"
      onpointerup="hideRole()" onpointerleave="hideRole()" onpointercancel="hideRole()"
      oncontextmenu="return false">${holdIdle()}</div>
          <button class="primary" id="nextBtn" disabled onclick="nextReveal()">${ic("arrow")}Ho gaya, agla player</button>
  `;
}

/* ---------- Sounds (synthesized, no files) ---------- */
var _ac = null, _roleShown = false;
function beep(seq) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!_ac) _ac = new AC();
    if (_ac.state === "suspended") _ac.resume();
    var t = _ac.currentTime;
    seq.forEach(function (n) {
      var o = _ac.createOscillator(), g = _ac.createGain();
      o.type = n.type || "sine";
      o.frequency.setValueAtTime(n.f, t + n.at);
      if (n.to) o.frequency.exponentialRampToValueAtTime(n.to, t + n.at + n.d);
      g.gain.setValueAtTime(0.0001, t + n.at);
      g.gain.exponentialRampToValueAtTime(n.v || 0.16, t + n.at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n.at + n.d);
      o.connect(g);
      g.connect(_ac.destination);
      o.start(t + n.at);
      o.stop(t + n.at + n.d + 0.03);
    });
  } catch (e) {}
}
function sndShow() {
  beep([{ f: 440, to: 660, at: 0, d: 0.09, type: "triangle" }, { f: 660, to: 990, at: 0.07, d: 0.14, type: "triangle" }]);
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
}
function sndHide() {
  beep([{ f: 740, to: 520, at: 0, d: 0.08, type: "triangle" }, { f: 520, to: 300, at: 0.06, d: 0.13, type: "triangle" }]);
}

function showRole(i) {
  _roleShown = true;
  sndShow();
  const p = S.roster[i];
  $("nextBtn").disabled = false;
  const box = $("roleBox");
  if (p.role === "spy" && !p.word) {
    box.className = "hold open spyview";
        box.innerHTML = `<div class="tag spy">Tum SPY ho</div><p>Word nahi pata. Baaton se pakdo mat jaana.</p>`;
  } else {
    box.className = "hold open";
        box.innerHTML = `<div class="tag">Tumhara word</div><div class="word">${esc(p.word)}</div>`;
  }
}

function hideRole() {
  const box = $("roleBox");
  if (box) { box.className = "hold"; box.innerHTML = holdIdle(); }
    if (_roleShown) { _roleShown = false; sndHide(); }
}

function sndNext() {
  beep([
    { f: 300, to: 900, at: 0, d: 0.14, type: "sawtooth", v: 0.05 },
    { f: 784, at: 0.12, d: 0.12, type: "triangle", v: 0.15 },
    { f: 1175, at: 0.2, d: 0.2, type: "triangle", v: 0.15 }
  ]);
  try { if (navigator.vibrate) navigator.vibrate([10, 30, 10]); } catch (e) {}
}
function sndStart() {
  beep([
    { f: 523, at: 0, d: 0.12, type: "triangle", v: 0.16 },
    { f: 659, at: 0.1, d: 0.12, type: "triangle", v: 0.16 },
    { f: 784, at: 0.2, d: 0.12, type: "triangle", v: 0.16 },
    { f: 1047, at: 0.3, d: 0.3, type: "triangle", v: 0.18 }
  ]);
  try { if (navigator.vibrate) navigator.vibrate([15, 40, 15, 40, 25]); } catch (e) {}
}

function nextReveal() {
  S.revealIdx++;
  if (S.revealIdx >= S.roster.length) { sndStart(); return renderDiscussion(false); }
  sndNext();
  renderReveal();
}

/* ---------- Discussion timer ---------- */
function renderDiscussion(keep) {
  S.screen = "discussion";
  if (!keep) {
    S.timerLeft = S.discussionMin * 60;
    var al = alive();
    S.starter = al.length ? al[Math.floor(Math.random() * al.length)].name : "";
  } else if (S.timerLeft <= 0) {
    S.timerLeft = 60;
  }
  S.paused = false;
  saveRound("discussion");

  app.innerHTML = `
    <p class="sub">Round ${S.round} · ${alive().length} player bache hain</p>
    <h1>Discussion</h1>
    <p class="sub">Sawal aisa rakho jo sirf word jaanne wale ka jawab de sake.${S.starter ? " Shuruwat: <b>" + esc(S.starter) + "</b>." : ""}</p>
    <div class="big${S.timerLeft <= 30 ? " low" : ""}" id="clock">${fmt(S.timerLeft)}</div>
    <div class="row">
      <button id="pauseBtn" onclick="togglePause()">Pause</button>
      <button class="primary" onclick="goVote()">${ic("check")}Vote karo</button>
    </div>
    <div class="panel">
      <ul class="players">${alive().map(p => `<li><span class="pn"><i class="av">${ini(p.name)}</i>${esc(p.name)}</span></li>`).join("")}</ul>
    </div>
  `;
  startTimer();
}

function startTimer() {
  clearInterval(S.timerId);
  S.deadline = Date.now() + S.timerLeft * 1000;   // wall-clock based, so screen lock cannot freeze it
  S.timerId = setInterval(tick, 500);
}

function tick() {
  if (S.screen !== "discussion") { clearInterval(S.timerId); return; }
  if (S.paused) return;
  S.timerLeft = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000));
  var c = $("clock");
  if (c) {
    c.textContent = fmt(S.timerLeft);
    c.classList.toggle("low", S.timerLeft <= 30);
  }
  if (S.timerLeft <= 0) {
    clearInterval(S.timerId);
    goVote();
  } else if (S.timerLeft % 5 === 0) {
    saveRound("discussion");
  }
}

function togglePause() {
  if (!S.paused) { tick(); S.paused = true; }
  else { S.paused = false; S.deadline = Date.now() + S.timerLeft * 1000; }
  var b = $("pauseBtn");
  if (b) b.textContent = S.paused ? "Resume" : "Pause";
  var c = $("clock");
  if (c) c.classList.toggle("paused", S.paused);
  saveRound("discussion");
}

/* ---------- Voting ---------- */
function goVote() {
  clearInterval(S.timerId);
  renderVote();
}

function renderVote() {
  S.screen = "vote";
  S.voteSel = -1;
  saveRound("vote");
  var buttons = S.roster
    .map(function (p, i) { return { p: p, i: i }; })
    .filter(function (x) { return x.p.alive; })
    .map(function (x) {
      return `<button class="vb" id="vb${x.i}" onclick="pickVote(${x.i})"><i class="av">${ini(x.p.name)}</i>${esc(x.p.name)}</button>`;
    })
    .join("");
  app.innerHTML = `
    <h1>Vote</h1>
    <p class="sub">Group mein faisla karo, phir jiske against vote hua use chuno.</p>
    <div class="votes">${buttons}</div>
    <button class="primary" id="confirmVote" disabled onclick="confirmVote()">Pehle kisi ko chuno</button>
    <button class="ghost wide" onclick="renderDiscussion(true)">${ic("undo")}Barabar vote, discussion wapas</button>
  `;
}

function pickVote(i) {
  if (S.screen !== "vote") return;
  S.voteSel = i;
  S.roster.forEach(function (p, k) {
    var b = $("vb" + k);
    if (b) b.classList.toggle("sel", k === i);
  });
  var c = $("confirmVote");
  if (c) {
    c.disabled = false;
    c.textContent = S.roster[i].name + " ko bahar karo";
  }
}

function confirmVote() {
  if (S.screen !== "vote" || S.voteSel < 0) return;
  eliminate(S.voteSel);
}

function eliminate(i) {
  if (S.screen !== "vote") return;
  const p = S.roster[i];
  if (!p || !p.alive) return;
  p.alive = false;

  // Last spy caught: spy gets one chance to guess the civilian word.
  if (p.role === "spy" && spiesAlive() === 0) return renderGuess(p);

  // Spies equal or outnumber civilians: spies win.
  if (spiesAlive() >= civsAlive()) {
    return endRound("spy", `${p.name} nikla gaya, aur ab spies barabar ya zyada hain.`);
  }

  renderOut(p);
}

function renderOut(p) {
  S.screen = "out";
  saveRound("out");
  app.innerHTML = `
    <p class="sub">Vote ka faisla</p>
    <h1>${esc(p.name)} bahar</h1>
    <span class="tag ${p.role === "spy" ? "spy" : ""}">${p.role === "spy" ? "Ye SPY tha" : "Ye civilian tha"}</span>
    <p class="sub">Khel chal raha hai. Dhyaan rakho, spy abhi bhi group mein hai.</p>
    <button class="primary" onclick="renderDiscussion(false)">${ic("arrow")}Discussion jaari rakho</button>
  `;
}

/* ---------- Spy's last chance ---------- */
function renderGuess(p) {
  S.screen = "guess";
  // Unique words only: the packs share some words, so the decoy pool must be deduplicated.
  const everyWord = [...new Set((getPacks()[S.pack] || []).flat())];
  const pool = shuffle(everyWord.filter(w => w !== S.civWord && w !== S.spyWordText));
  S.guessOpts = shuffle([S.civWord, ...pool.slice(0, 3)]);
  app.innerHTML = `
    <p class="sub">Aakhri mauka</p>
    <h1>${esc(p.name)} spy tha</h1>
    <p class="sub">Civilian ka word sahi guess kiya to spies jeet jaayenge.</p>
    <div class="votes">
      ${S.guessOpts.map((w, i) => `<button onclick="guessAnswer(${i})">${esc(w)}</button>`).join("")}
    </div>
  `;
}

function guessAnswer(i) {
  if (S.screen !== "guess") return;
  if (S.guessOpts[i] === S.civWord) {
    endRound("spy", "Spy ne civilian ka word sahi guess kar liya.");
  } else {
    endRound("civ", "Spy ka guess galat nikla. Civilians jeet gaye.");
  }
}

/* ---------- Round end and scoring ---------- */
function endRound(winner, reason) {
  if (S.screen === "result") return;
  clearInterval(S.timerId);
  S.screen = "result";
  clearRound();
  const winners = S.roster.filter(p => winner === "spy" ? p.role === "spy" : p.role === "civ");
  winners.forEach(p => {
    S.scores[p.name] = (S.scores[p.name] || 0) + (winner === "spy" ? 3 : 2);
  });

  saveState();
    const spyNames = S.roster.filter(p => p.role === "spy").map(p => esc(p.name)).join(", ");
  const scoreRows = S.players.map(p =>
    `<li><span>${esc(p)}</span><span class="score">${S.scores[p] || 0}</span></li>`).join("");

  app.innerHTML = `
    <p class="sub">Round ${S.round} khatam</p>
    <h1>${ic("trophy")}${winner === "spy" ? "Spies jeet gaye" : "Civilians jeet gaye"}</h1>
    <p class="sub">${esc(reason)}</p>
    <div class="panel">
      <p>Civilian ka word: <span class="word" style="font-size:22px">${esc(S.civWord)}</span></p>
      <p>Spy: ${spyNames}</p>
      <p>Spy ka word: ${S.spyWordText ? `<span class="word" style="font-size:22px">${esc(S.spyWordText)}</span>` : "koi nahi (Classic)"}</p>
    </div>
    <div class="panel">
      <label>Scoreboard</label>
      <ul class="players">${scoreRows}</ul>
    </div>
    <button class="primary" onclick="startRound()">${ic("refresh")}Agla round, same log</button>
        <button onclick="renderSetup()">${ic("back")}Setup par jao</button>
  `;
}

var _lastScr = "";
new MutationObserver(function () {
  if (S.screen === _lastScr && S.screen !== "reveal") {
      app.classList.add("still");
      return;
    }
    _lastScr = S.screen;
    app.classList.remove("still");
    app.classList.remove("in");
  void app.offsetWidth;
  app.classList.add("in");
}).observe(app, { childList: true });

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    if (S.screen === "discussion") tick();
  } else {
    saveState();
    if (S.screen === "discussion" || S.screen === "vote" || S.screen === "out") saveRound(S.screen);
  }
});
window.addEventListener("pagehide", saveState);

loadState();
S.resume = loadRoundSaved();
renderSetup();
</script>
</body>
